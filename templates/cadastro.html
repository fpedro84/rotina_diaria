{% extends "base.html" %}
{% block title %}Cadastro – Rotina Diária{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo"></div>
            <h1>Criar Conta</h1>
            <p>Junte-se à plataforma Rotina Diária</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="Mínimo 4 caracteres">
            </div>
            <div class="form-group">
                <label for="perfil">Perfil</label>
                <select id="perfil" name="perfil">
                    <option value="responsavel">Responsável / Familiar</option>
                    <option value="educador">Educador / Professor</option>
                    <option value="terapeuta">Terapeuta / Psicólogo</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Criar Conta</button>
        </form>

        <div class="auth-footer">
            <p>Já tem conta? <a href="{{ url_for('login') }}">Fazer login</a></p>
        </div>
    </div>
</div>
{% endblock %}
